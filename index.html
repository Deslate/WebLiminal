<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#d2d9c4" />
    <meta
      name="description"
      content="The water remembers this place. A Poolrooms you can walk into."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c2dace'/%3E%3Cpath d='M8 26V13a8 8 0 0 1 16 0v13' fill='none' stroke='%23647263' stroke-width='3'/%3E%3C/svg%3E"
    />

    <link rel="stylesheet" href="/src/style.css" />
    <title>No Deep Water Here · STILL WATER</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #c5d4c5;
      }
      body {
        font-family: "Courier New", monospace;
        color: #ffffe9;
      }
    </style>
  </head>
  <body>
    <main
      id="experience"
      aria-label="Poolrooms. WASD or up/down to move. Left/right to cycle locations, 1-5 to teleport. Drag to look, M for sound, Tab to pause."
    ></main>
    <div class="film" aria-hidden="true"></div>
    <div class="tape" aria-hidden="true">
      <span>PLAY <i>▶</i></span
      ><span>SP</span>
    </div>
    <div class="archive" aria-hidden="true">
      <span class="archive-label">FIELD RECORDING — 001</span
      ><span class="record"
        ><b></b> REC <span id="timecode">00:00:00</span></span
      >
    </div>
    <div class="caption" aria-hidden="true">
      <div class="index">— &nbsp; 01 / UNDOCUMENTED</div>
      <h1>No Deep Water Here</h1>
      <p>STILL WATER</p>
    </div>
    <footer>
      <span class="coordinates"
        >DEPTH &nbsp; 0.42 M <em>/</em> OCCUPANCY &nbsp; 01</span
      ><span id="hint"
        >W A S D &nbsp; move &nbsp; · &nbsp; Left / Right or 1–5 locations &nbsp; · &nbsp; drag to look &nbsp; · &nbsp; M
        sound &nbsp; · &nbsp; V overhead view &nbsp; · &nbsp; Shift walk fast &nbsp; · &nbsp; Tab pause / resume &nbsp; · &nbsp; G lab</span
      >
    </footer>
    <div id="audio-status" role="status"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
